<!DOCTYPE html>
<html>
<head>
    <title>Edit Expense</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>✏️ Edit Expense</h1>

    <form method="POST">

        <label>Expense Title</label>
        <input
            type="text"
            name="title"
            value="{{ expense.title }}"
            required
        >

        <label>Amount</label>
        <input
            type="number"
            name="amount"
            step="0.01"
            value="{{ expense.amount }}"
            required
        >

        <label>Category</label>
        <select name="category" required>
            <option value="Food" {% if expense.category == "Food" %}selected{% endif %}>Food</option>
            <option value="Travel" {% if expense.category == "Travel" %}selected{% endif %}>Travel</option>
            <option value="Shopping" {% if expense.category == "Shopping" %}selected{% endif %}>Shopping</option>
            <option value="Education" {% if expense.category == "Education" %}selected{% endif %}>Education</option>
            <option value="Bills" {% if expense.category == "Bills" %}selected{% endif %}>Bills</option>
            <option value="Other" {% if expense.category == "Other" %}selected{% endif %}>Other</option>
        </select>

        <label>Date</label>
        <input
            type="date"
            name="expense_date"
            value="{{ expense.expense_date }}"
            required
        >

        <label>Description</label>
        <textarea name="description">{{ expense.description }}</textarea>

        <button type="submit">Update Expense</button>

    </form>

    <br>

    <a href="{{ url_for('home') }}">← Back to Home</a>

</div>

</body>
</html>
